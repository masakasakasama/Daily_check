<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Daily Check</title>
  <meta name="description" content="毎日の重要更新と参考情報を確認するダッシュボード">
  <style>
    :root{
      --bg:#09090b;
      --surface:#111113;
      --surface2:#161619;
      --line:#242428;
      --line-soft:#1b1b1f;
      --text:#f4f4f5;
      --sub:#a1a1aa;
      --muted:#71717a;
      --accent:#9b9cff;
      --important:#f0c674;
      --ok:#66c2a5;
      --danger:#ff7b7b;
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      background:var(--bg);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button,a{font:inherit;-webkit-tap-highlight-color:transparent}
    button{color:inherit}
    [hidden]{display:none!important}
    .app{
      width:min(100%,680px);
      margin:0 auto;
      padding:18px 18px calc(40px + env(safe-area-inset-bottom));
    }
    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      padding-bottom:18px;
    }
    .brand{
      min-width:0;
    }
    .brand-row{
      display:flex;
      align-items:center;
      gap:9px;
    }
    .mark{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 18px rgba(155,156,255,.45);
    }
    h1{
      margin:0;
      font-size:19px;
      line-height:1.2;
      letter-spacing:-.025em;
      font-weight:720;
    }
    .updated{
      margin:6px 0 0 17px;
      color:var(--muted);
      font-size:10px;
      font-variant-numeric:tabular-nums;
    }
    .top-actions{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .segmented{
      display:flex;
      padding:2px;
      border:1px solid var(--line);
      background:#0d0d0f;
      border-radius:9px;
    }
    .segmented button{
      border:0;
      background:transparent;
      color:var(--muted);
      padding:6px 10px;
      border-radius:7px;
      font-size:10px;
      font-weight:700;
      cursor:pointer;
    }
    .segmented button.active{
      color:var(--text);
      background:var(--surface2);
    }
    .refresh{
      width:30px;
      height:30px;
      border:1px solid var(--line);
      border-radius:9px;
      display:grid;
      place-items:center;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
    }
    .refresh svg{
      width:14px;height:14px;
      fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;
    }
    .datebar{
      display:grid;
      grid-template-columns:30px 1fr 30px;
      align-items:center;
      gap:8px;
      padding:12px 0 13px;
      border-top:1px solid var(--line-soft);
      border-bottom:1px solid var(--line);
    }
    .date-button{
      width:30px;height:30px;
      border:0;
      border-radius:8px;
      background:transparent;
      color:var(--muted);
      display:grid;
      place-items:center;
      font-size:21px;
      cursor:pointer;
    }
    .date-button:disabled{opacity:.18;cursor:default}
    .date-center{text-align:center}
    .date-main{
      margin:0;
      font-size:15px;
      font-weight:720;
      letter-spacing:-.015em;
    }
    .date-sub{
      margin:3px 0 0;
      color:var(--muted);
      font-size:9px;
    }
    .stats{
      display:flex;
      align-items:center;
      gap:0;
      min-height:42px;
      border-bottom:1px solid var(--line);
    }
    .stat{
      display:flex;
      align-items:baseline;
      gap:5px;
      padding-right:14px;
      margin-right:14px;
      border-right:1px solid var(--line-soft);
      white-space:nowrap;
    }
    .stat:last-child{border-right:0;margin-right:0;padding-right:0}
    .stat-label{
      color:var(--muted);
      font-size:10px;
    }
    .stat-value{
      color:var(--text);
      font-size:13px;
      font-weight:740;
      font-variant-numeric:tabular-nums;
    }
    .stat.important .stat-value{color:var(--important)}
    .stat.reference .stat-value{color:var(--accent)}
    .section{
      margin-top:26px;
    }
    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:8px;
    }
    h2{
      margin:0;
      font-size:13px;
      line-height:1.2;
      font-weight:720;
      letter-spacing:-.012em;
    }
    .section-count{
      color:var(--muted);
      font-size:10px;
      font-variant-numeric:tabular-nums;
    }
    .empty-line{
      display:flex;
      align-items:center;
      gap:8px;
      padding:11px 0 12px;
      border-top:1px solid var(--line-soft);
      border-bottom:1px solid var(--line-soft);
      color:var(--muted);
      font-size:11px;
    }
    .empty-line::before{
      content:"";
      width:6px;height:6px;
      border-radius:50%;
      background:var(--ok);
    }
    .feed{
      border-top:1px solid var(--line-soft);
    }
    .feed-item{
      display:grid;
      grid-template-columns:42px 1fr;
      gap:12px;
      padding:14px 0;
      border-bottom:1px solid var(--line-soft);
    }
    .score{
      padding-top:2px;
      color:var(--accent);
      font-size:13px;
      font-weight:760;
      font-variant-numeric:tabular-nums;
      letter-spacing:-.01em;
    }
    .feed-item.important .score{color:var(--important)}
    .score small{
      display:block;
      margin-top:2px;
      color:var(--muted);
      font-size:8px;
      font-weight:650;
      letter-spacing:.04em;
    }
    .feed-body{min-width:0}
    .feed-title{
      margin:0;
      color:var(--text);
      font-size:14px;
      line-height:1.45;
      font-weight:690;
      letter-spacing:-.012em;
    }
    .feed-summary{
      margin:5px 0 0;
      color:var(--sub);
      font-size:11px;
      line-height:1.56;
    }
    .feed-meta{
      display:flex;
      align-items:center;
      gap:7px;
      margin-top:7px;
      color:var(--muted);
      font-size:9px;
    }
    .feed-meta .dot::before{content:"·";margin-right:7px}
    .source{
      color:var(--muted);
      text-decoration:none;
    }
    .source:hover{color:var(--text)}
    .week-range{
      padding:14px 0 4px;
      color:var(--muted);
      font-size:10px;
      font-variant-numeric:tabular-nums;
    }
    .week-headline{
      margin:0;
      padding:0 0 18px;
      border-bottom:1px solid var(--line);
      color:var(--text);
      font-size:16px;
      line-height:1.55;
      font-weight:690;
      letter-spacing:-.018em;
    }
    .category-grid{
      margin-top:18px;
      border-top:1px solid var(--line-soft);
    }
    .category-row{
      display:grid;
      grid-template-columns:62px 1fr;
      gap:12px;
      padding:11px 0;
      border-bottom:1px solid var(--line-soft);
    }
    .category-name{
      color:var(--text);
      font-size:10px;
      font-weight:750;
    }
    .category-summary{
      margin:0;
      color:var(--sub);
      font-size:10px;
      line-height:1.55;
    }
    details.monitor{
      margin-top:28px;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
    }
    details.monitor>summary,
    details.more>summary{
      list-style:none;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:11px 0;
      color:var(--muted);
      font-size:10px;
      cursor:pointer;
    }
    details.monitor>summary::-webkit-details-marker,
    details.more>summary::-webkit-details-marker{display:none}
    .monitor-list{border-top:1px solid var(--line-soft)}
    .monitor-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      padding:10px 0;
      border-bottom:1px solid var(--line-soft);
    }
    .monitor-row:last-child{border-bottom:0}
    .monitor-left{
      display:flex;
      align-items:flex-start;
      gap:8px;
      min-width:0;
    }
    .status{
      width:6px;height:6px;
      margin-top:5px;
      flex:0 0 auto;
      border-radius:50%;
      background:var(--muted);
    }
    .monitor-row.clear .status{background:var(--ok)}
    .monitor-row.update .status{background:var(--important)}
    .monitor-row.error .status{background:var(--danger)}
    .monitor-name{
      color:var(--text);
      font-size:10px;
      font-weight:680;
    }
    .monitor-summary-text{
      margin:2px 0 0;
      color:var(--muted);
      font-size:9px;
      line-height:1.45;
    }
    .monitor-count{
      color:var(--muted);
      font-size:9px;
      font-variant-numeric:tabular-nums;
    }
    details.more{
      margin-top:22px;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
    }
    .error{
      margin-top:18px;
      padding:11px 0;
      border-top:1px solid rgba(255,123,123,.28);
      color:#ffaaaa;
      font-size:10px;
    }
    @media(max-width:420px){
      .app{padding:16px 16px calc(34px + env(safe-area-inset-bottom))}
      .topbar{padding-bottom:15px}
      h1{font-size:18px}
      .segmented button{padding:6px 9px}
      .feed-item{grid-template-columns:38px 1fr;gap:10px}
      .feed-title{font-size:13px}
      .feed-summary{font-size:10.5px}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-row">
          <span class="mark"></span>
          <h1>Daily Check</h1>
        </div>
        <p id="updatedAt" class="updated">読み込み中</p>
      </div>
      <div class="top-actions">
        <div class="segmented" aria-label="表示期間">
          <button id="dayMode" class="active" type="button">今日</button>
          <button id="weekMode" type="button">7日</button>
        </div>
        <button id="refreshButton" class="refresh" type="button" aria-label="再読み込み">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6v5h-5M4 18v-5h5M18.4 9A7 7 0 0 0 6.8 6.8L4 9m16 6-2.8 2.2A7 7 0 0 1 5.6 15"/>
          </svg>
        </button>
      </div>
    </header>

    <section id="dayView">
      <nav class="datebar" aria-label="日付">
        <button id="prevDay" class="date-button" type="button" aria-label="前の記録">‹</button>
        <div class="date-center">
          <p id="dayLabel" class="date-main">----</p>
          <p id="weekdayLabel" class="date-sub">----</p>
        </div>
        <button id="nextDay" class="date-button" type="button" aria-label="次の記録">›</button>
      </nav>

      <div class="stats" aria-label="概要">
        <div class="stat important"><span class="stat-label">重要</span><strong id="alertCount" class="stat-value">0</strong></div>
        <div class="stat reference"><span class="stat-label">参考</span><strong id="referenceCount" class="stat-value">0</strong></div>
        <div class="stat"><span class="stat-label">監視</span><strong id="checkedCount" class="stat-value">0/0</strong></div>
      </div>

      <section class="section">
        <div class="section-head">
          <h2>重要更新</h2>
          <span id="alertSectionCount" class="section-count"></span>
        </div>
        <div id="alertList" class="feed"></div>
        <div id="emptyAlerts" class="empty-line" hidden>通知条件を満たす新規情報なし</div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>参考情報</h2>
          <span id="referenceSectionCount" class="section-count"></span>
        </div>
        <div id="referenceList" class="feed"></div>
        <div id="emptyReferences" class="empty-line" hidden>新規の参考情報なし</div>
      </section>

      <details class="monitor">
        <summary>
          <span>監視状況</span>
          <span id="monitorSummary"></span>
        </summary>
        <div id="monitorList" class="monitor-list"></div>
      </details>
    </section>

    <section id="weekView" hidden>
      <div id="weekPeriod" class="week-range"></div>
      <p id="weekHeadline" class="week-headline"></p>
      <div id="weekCategories" class="category-grid"></div>

      <section class="section">
        <div class="section-head">
          <h2>重要トピック</h2>
          <span id="weekHighlightCount" class="section-count"></span>
        </div>
        <div id="weekHighlights" class="feed"></div>
      </section>

      <details class="more">
        <summary>
          <span>その他</span>
          <span id="weekMoreSummary"></span>
        </summary>
        <div id="weekReferences" class="feed"></div>
      </details>
    </section>

    <p id="errorMessage" class="error" hidden></p>
  </main>

  <script>
    const DATA_URL='https://raw.githubusercontent.com/masakasakasama/Daily_check/main/data/daily-checks.json';
    const state={data:null,date:null,view:'day'};
    const $=id=>document.getElementById(id);
    const setText=(id,value)=>{const el=$(id);if(el)el.textContent=value??''};

    function fmtDateTime(iso){
      if(!iso)return '未確認';
      return new Intl.DateTimeFormat('ja-JP',{
        timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',
        hour:'2-digit',minute:'2-digit'
      }).format(new Date(iso));
    }
    function fmtTime(iso){
      if(!iso)return '';
      return new Intl.DateTimeFormat('ja-JP',{
        timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'
      }).format(new Date(iso));
    }
    function fmtDateLabel(date){
      const d=new Date(date+'T00:00:00+09:00');
      setText('dayLabel',new Intl.DateTimeFormat('ja-JP',{
        timeZone:'Asia/Tokyo',month:'long',day:'numeric'
      }).format(d));
      setText('weekdayLabel',new Intl.DateTimeFormat('ja-JP',{
        timeZone:'Asia/Tokyo',year:'numeric',weekday:'short'
      }).format(d));
    }
    function shortDate(date){
      const d=new Date(date+'T00:00:00+09:00');
      return new Intl.DateTimeFormat('ja-JP',{
        timeZone:'Asia/Tokyo',month:'numeric',day:'numeric'
      }).format(d);
    }
    function getDays(){
      return [...(state.data?.days||[])].sort((a,b)=>a.date.localeCompare(b.date));
    }
    function getDay(){
      return (state.data?.days||[]).find(x=>x.date===state.date)||null;
    }
    function isFutureDate(date){
      return date > (state.data?.currentDate||date);
    }
    function getWeek(){
      const weeks=state.data?.weeks||[];
      return weeks.find(w=>state.date>=w.start&&state.date<=w.end)||weeks[0]||null;
    }
    function syncUrl(){
      const u=new URL(location.href);
      u.searchParams.set('date',state.date);
      if(state.view==='week')u.searchParams.set('view','week');
      else u.searchParams.delete('view');
      history.replaceState(null,'',u);
    }
    function updateDateNav(){
      if($('prevDay'))$('prevDay').disabled=false;
      if($('nextDay'))$('nextDay').disabled=false;
    }
    function createFeedItem(item,type){
      const row=document.createElement('article');
      row.className='feed-item '+type;

      const score=document.createElement('div');
      score.className='score';
      score.textContent=item.score!=null?String(item.score):'–';
      const small=document.createElement('small');
      small.textContent=item.category||'';
      score.appendChild(small);

      const body=document.createElement('div');
      body.className='feed-body';

      const title=document.createElement('h3');
      title.className='feed-title';
      title.textContent=item.title||'無題';

      const summary=document.createElement('p');
      summary.className='feed-summary';
      summary.textContent=item.summary||'';

      const meta=document.createElement('div');
      meta.className='feed-meta';

      if(item.publishedAt){
        const date=document.createElement('span');
        date.textContent=item.publishedAt;
        meta.appendChild(date);
      }

      if(item.source?.url){
        const a=document.createElement('a');
        a.className='source dot';
        a.href=item.source.url;
        a.target='_blank';
        a.rel='noreferrer';
        a.textContent=item.source.label||'出典';
        meta.appendChild(a);
      }

      body.append(title);
      if(item.summary)body.append(summary);
      body.append(meta);
      row.append(score,body);
      return row;
    }
    function createMonitorRow(item){
      const row=document.createElement('article');
      row.className='monitor-row '+(item.status||'pending');

      const left=document.createElement('div');
      left.className='monitor-left';

      const dot=document.createElement('span');
      dot.className='status';

      const text=document.createElement('div');
      const name=document.createElement('div');
      name.className='monitor-name';
      name.textContent=item.name||'';
      const summary=document.createElement('p');
      summary.className='monitor-summary-text';
      summary.textContent=item.summary||'';
      text.append(name,summary);
      left.append(dot,text);

      const count=document.createElement('span');
      count.className='monitor-count';
      const parts=[];
      if(item.alertCount)parts.push('重要 '+item.alertCount);
      if(item.referenceCount)parts.push('参考 '+item.referenceCount);
      count.textContent=parts.join(' · ')||'0';

      row.append(left,count);
      return row;
    }
    function renderDay(){
      const day=getDay();
      fmtDateLabel(state.date);
      updateDateNav();

      if(!day){
        const future=isFutureDate(state.date);
        setText('alertCount','–');
        setText('referenceCount','–');
        setText('checkedCount','–');
        setText('alertSectionCount','');
        setText('referenceSectionCount','');
        setText('monitorSummary',future?'未実行':'履歴なし');
        $('alertList')?.replaceChildren();
        $('referenceList')?.replaceChildren();
        $('monitorList')?.replaceChildren();
        if($('emptyAlerts')){
          $('emptyAlerts').textContent=future?'この日はまだ未実行':'この日の履歴データなし';
          $('emptyAlerts').hidden=false;
        }
        if($('emptyReferences'))$('emptyReferences').hidden=true;
        return;
      }

      const alerts=day.alerts||[];
      const references=day.references||[];
      const checks=day.checks||[];
      const checked=checks.filter(x=>x.status!=='pending');
      const latest=checked.map(x=>x.checkedAt).filter(Boolean).sort().at(-1);

      setText('alertCount',alerts.length);
      setText('referenceCount',references.length);
      setText('checkedCount',checked.length+'/'+checks.length);
      setText('alertSectionCount',alerts.length?alerts.length+'件':'');
      setText('referenceSectionCount',references.length?references.length+'件':'');
      setText('monitorSummary',checked.length+'/'+checks.length+(latest?' · '+fmtTime(latest):''));

      $('alertList')?.replaceChildren(...alerts.map(x=>createFeedItem(x,'important')));
      $('referenceList')?.replaceChildren(...references.map(x=>createFeedItem(x,'reference')));
      $('monitorList')?.replaceChildren(...checks.map(createMonitorRow));

      if($('emptyAlerts')){
        $('emptyAlerts').textContent='通知条件を満たす新規情報なし';
        $('emptyAlerts').hidden=alerts.length>0;
      }
      if($('emptyReferences')){
        $('emptyReferences').textContent='新規の参考情報なし';
        $('emptyReferences').hidden=references.length>0;
      }
    }
    function renderWeek(){
      const week=getWeek();
      if(!week)return;

      setText('weekPeriod',shortDate(week.start)+' – '+shortDate(week.end));
      setText('weekHeadline',week.headline||'');

      const categoryRows=(week.categories||[]).map(c=>{
        const row=document.createElement('article');
        row.className='category-row';
        const name=document.createElement('div');
        name.className='category-name';
        name.textContent=c.name||'';
        const summary=document.createElement('p');
        summary.className='category-summary';
        summary.textContent=c.summary||'';
        row.append(name,summary);
        return row;
      });
      $('weekCategories')?.replaceChildren(...categoryRows);

      const highlights=week.highlights||[];
      const refs=week.references||[];
      $('weekHighlights')?.replaceChildren(...highlights.map(x=>createFeedItem(x,'important')));
      $('weekReferences')?.replaceChildren(...refs.map(x=>createFeedItem(x,'reference')));
      setText('weekHighlightCount',highlights.length?highlights.length+'件':'');
      setText('weekMoreSummary',refs.length+'件');
    }
    function render(){
      setText('updatedAt','更新 '+fmtDateTime(state.data?.updatedAt));
      if($('dayView'))$('dayView').hidden=state.view!=='day';
      if($('weekView'))$('weekView').hidden=state.view!=='week';
      $('dayMode')?.classList.toggle('active',state.view==='day');
      $('weekMode')?.classList.toggle('active',state.view==='week');

      if(state.view==='day')renderDay();
      else renderWeek();
      syncUrl();
    }
    function setView(view){
      state.view=view;
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    }
    function moveRecordedDay(delta){
      const d=new Date(state.date+'T00:00:00+09:00');
      d.setDate(d.getDate()+delta);
      state.date=d.toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    }
    async function load(){
      try{
        if($('errorMessage'))$('errorMessage').hidden=true;
        const r=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'});
        if(!r.ok)throw new Error('HTTP '+r.status);
        state.data=await r.json();

        const params=new URLSearchParams(location.search);
        const requested=params.get('date');
        const dates=(state.data.days||[]).map(x=>x.date);
        state.date=dates.includes(requested)
          ? requested
          : state.data.currentDate||state.data.days?.[0]?.date;
        state.view=params.get('view')==='week'?'week':'day';
        render();
      }catch(e){
        if($('errorMessage')){
          $('errorMessage').textContent='データを読み込めません: '+e.message;
          $('errorMessage').hidden=false;
        }
      }
    }

    $('refreshButton')?.addEventListener('click',load);
    $('prevDay')?.addEventListener('click',()=>moveRecordedDay(-1));
    $('nextDay')?.addEventListener('click',()=>moveRecordedDay(1));
    $('dayMode')?.addEventListener('click',()=>setView('day'));
    $('weekMode')?.addEventListener('click',()=>setView('week'));
    load();
  </script>
</body>
</html>
