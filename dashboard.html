<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark">
  <title>Daily Check</title>
  <meta name="description" content="毎日の監視結果をひとつにまとめるダッシュボード">
  <style>
:root {
  --bg:#0a0d12; --panel:#121722; --panel2:#171d29; --line:#262e3d;
  --text:#f4f7fb; --muted:#929daf; --green:#42d392; --red:#ff6b6b;
  --yellow:#f3c969; --blue:#7aa2f7;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at top right,rgba(122,162,247,.12),transparent 34rem),var(--bg)
}
button,a{-webkit-tap-highlight-color:transparent}
.shell{width:min(100%,760px);margin:0 auto;padding:28px 18px 44px}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.eyebrow,.section-kicker{margin:0 0 7px;color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.15em}
h1{margin:0;font-size:clamp(32px,8vw,48px);line-height:1.05;letter-spacing:-.04em}
h2{margin:0;font-size:22px;letter-spacing:-.02em}
.muted{margin:10px 0 0;color:var(--muted);font-size:13px}
.icon-button,.date-nav{
  border:1px solid var(--line);background:rgba(18,23,34,.86);color:var(--text);
  border-radius:14px;display:grid;place-items:center;cursor:pointer
}
.icon-button{width:44px;height:44px}
.icon-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.date-strip{margin:30px 0 16px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center}
.date-nav{width:40px;height:40px;font-size:28px}
.day-label{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.weekday-label{margin:5px 0 0;color:var(--muted);font-size:12px}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 34px}
.metric{padding:15px 14px;border:1px solid var(--line);background:rgba(18,23,34,.78);border-radius:16px}
.metric span{display:block;color:var(--muted);font-size:11px}
.metric strong{display:block;margin-top:5px;font-size:26px;letter-spacing:-.04em}
.section{margin-top:34px}
.section-heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}
.pill,.status-chip{
  border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:11px;font-weight:700
}
.card-list{display:grid;gap:12px}
.check-card{
  border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(23,29,41,.98),rgba(18,23,34,.98));
  padding:17px;box-shadow:0 18px 44px rgba(0,0,0,.16)
}
.check-card.update{border-color:rgba(243,201,105,.38)}
.check-card.error{border-color:rgba(255,107,107,.45)}
.card-top{display:flex;gap:12px;justify-content:space-between;align-items:center}
.title-row{display:flex;align-items:center;min-width:0;gap:9px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 4px rgba(146,157,175,.08)}
.update .status-dot{background:var(--yellow);box-shadow:0 0 0 4px rgba(243,201,105,.1)}
.clear .status-dot{background:var(--green);box-shadow:0 0 0 4px rgba(66,211,146,.1)}
.error .status-dot{background:var(--red);box-shadow:0 0 0 4px rgba(255,107,107,.1)}
.pending .status-dot{background:var(--blue);box-shadow:0 0 0 4px rgba(122,162,247,.1)}
.card-title{margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-summary{margin:13px 0 0;color:#dbe1ea;font-size:14px;line-height:1.65}
.detail-list{margin:12px 0 0;padding-left:20px;color:#c2cad5;font-size:13px;line-height:1.6}
.detail-list:empty{display:none}
.source-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.source-list:empty{display:none}
.source-list a{color:#b9ccff;text-decoration:none;border:1px solid rgba(122,162,247,.24);background:rgba(122,162,247,.08);border-radius:999px;padding:5px 9px;font-size:11px}
.card-meta{display:flex;justify-content:space-between;gap:12px;margin-top:15px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
.empty-state{display:flex;gap:12px;align-items:center;border:1px dashed var(--line);border-radius:18px;padding:18px;color:var(--muted)}
.empty-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:rgba(66,211,146,.1);color:var(--green)}
.empty-state strong{color:var(--text);font-size:14px}.empty-state p{margin:4px 0 0;font-size:12px}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:42px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
footer a{color:var(--muted);text-decoration:none}
.error{margin-top:20px;padding:13px;border-radius:12px;background:rgba(255,107,107,.08);color:#ffc0c0;font-size:12px}

.reference-list{display:grid;gap:10px}
.reference-card{border:1px solid var(--line);border-radius:16px;background:rgba(18,23,34,.72);padding:15px}
.reference-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.reference-top strong{font-size:14px;line-height:1.45}
.reference-score{flex:0 0 auto;border:1px solid rgba(122,162,247,.24);background:rgba(122,162,247,.08);color:#b9ccff;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
.reference-card p{margin:9px 0 0;color:#c6ceda;font-size:13px;line-height:1.6}
.reference-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11px}
.reference-card>a{display:inline-block;margin-top:11px;color:#b9ccff;text-decoration:none;font-size:11px}

@media(max-width:420px){.shell{padding-left:14px;padding-right:14px}.summary-grid{gap:7px}.metric{padding:13px 11px}.metric strong{font-size:23px}.card-title{font-size:16px}}

</style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">DAILY CHECK</p>
        <h1>毎日の更新</h1>
        <p id="updatedAt" class="muted">読み込み中</p>
      </div>
      <button id="refreshButton" class="icon-button" type="button" aria-label="再読み込み">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M18.4 9A7 7 0 0 0 6.8 6.8L4 9m16 6-2.8 2.2A7 7 0 0 1 5.6 15"/></svg>
      </button>
    </header>

    <nav class="date-strip" aria-label="日付">
      <button id="prevDay" class="date-nav" type="button" aria-label="前の日">‹</button>
      <div>
        <p id="dayLabel" class="day-label">----</p>
        <p id="weekdayLabel" class="weekday-label">----</p>
      </div>
      <button id="nextDay" class="date-nav" type="button" aria-label="次の日">›</button>
    </nav>

    <section class="summary-grid" aria-label="概要">
      <article class="metric">
        <span>更新あり</span>
        <strong id="alertCount">0</strong>
      </article>
      <article class="metric">
        <span>参考情報</span>
        <strong id="referenceCount">0</strong>
      </article>
      <article class="metric">
        <span>確認済み</span>
        <strong id="checkedCount">0</strong>
      </article>
    </section>

    <section class="section">
      <div class="section-heading">
        <div>
          <p class="section-kicker">PRIORITY</p>
          <h2>更新あり</h2>
        </div>
        <span id="priorityBadge" class="pill">0件</span>
      </div>
      <div id="priorityList" class="card-list"></div>
      <div id="emptyPriority" class="empty-state" hidden>
        <span class="empty-icon">✓</span>
        <div>
          <strong>重要な更新なし</strong>
          <p>通知条件に該当する新規情報はありません</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-heading">
        <div>
          <p class="section-kicker">REFERENCE</p>
          <h2>参考情報</h2>
        </div>
        <span id="referenceBadge" class="pill">0件</span>
      </div>
      <div id="referenceList" class="reference-list"></div>
      <div id="emptyReference" class="empty-state" hidden>
        <span class="empty-icon">−</span>
        <div>
          <strong>参考情報なし</strong>
          <p>通知基準未満の新規情報もありません</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-heading">
        <div>
          <p class="section-kicker">ALL CHECKS</p>
          <h2>監視一覧</h2>
        </div>
      </div>
      <div id="allList" class="card-list"></div>
    </section>

    <footer>
      <p>Daily Check</p>
      <a href="https://github.com/masakasakasama/Daily_check" target="_blank" rel="noreferrer">GitHub</a>
    </footer>

    <p id="errorMessage" class="error" hidden></p>
  </main>

  <template id="cardTemplate">
    <article class="check-card">
      <div class="card-top">
        <div class="title-row">
          <span class="status-dot"></span>
          <h3 class="card-title"></h3>
        </div>
        <span class="status-chip"></span>
      </div>
      <p class="card-summary"></p>
      <ul class="detail-list"></ul>
      <div class="source-list"></div>
      <div class="card-meta">
        <span class="checked-at"></span>
        <span class="priority"></span>
      </div>
    </article>
  </template>

  <script>
const DATA_URL='https://raw.githubusercontent.com/masakasakasama/Daily_check/main/data/daily-checks.json';
const state={data:null,date:null};
const $=(id)=>document.getElementById(id);

function fmtDate(iso){
  if(!iso)return '未確認';
  return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(iso));
}
function fmtDay(date){
  const d=new Date(date+'T00:00:00+09:00');
  $('dayLabel').textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',timeZone:'Asia/Tokyo'}).format(d);
  $('weekdayLabel').textContent=new Intl.DateTimeFormat('ja-JP',{weekday:'long',year:'numeric',timeZone:'Asia/Tokyo'}).format(d);
}
function label(status){return({update:'更新あり',clear:'重要更新なし',error:'エラー',pending:'待機中'})[status]||status}
function makeCard(item){
  const node=$('cardTemplate').content.firstElementChild.cloneNode(true);
  node.classList.add(item.status||'pending');
  node.querySelector('.card-title').textContent=item.name;
  node.querySelector('.status-chip').textContent=label(item.status||'pending');
  node.querySelector('.card-summary').textContent=item.summary||'まだ結果がありません';
  const ul=node.querySelector('.detail-list');
  (item.details||[]).forEach(x=>{const li=document.createElement('li');li.textContent=x;ul.appendChild(li)});
  const sources=node.querySelector('.source-list');
  (item.sources||[]).forEach((s,i)=>{
    const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noreferrer';a.textContent=s.label||('出典 '+(i+1));sources.appendChild(a)
  });
  node.querySelector('.checked-at').textContent='確認 '+fmtDate(item.checkedAt);
  node.querySelector('.priority').textContent=item.priority?'Priority '+item.priority:'';
  return node;
}
function makeReference(item,parent){
  const article=document.createElement('article');
  article.className='reference-card';
  const top=document.createElement('div');
  top.className='reference-top';
  const title=document.createElement('strong');
  title.textContent=item.title;
  const score=document.createElement('span');
  score.className='reference-score';
  score.textContent=item.score!=null?item.score+'点':'参考';
  top.append(title,score);
  const summary=document.createElement('p');
  summary.textContent=item.summary||'';
  const meta=document.createElement('div');
  meta.className='reference-meta';
  const source=document.createElement('span');
  source.textContent=parent.name;
  meta.appendChild(source);
  if(item.date){const date=document.createElement('span');date.textContent=item.date;meta.appendChild(date)}
  article.append(top,summary,meta);
  if(item.url){
    const a=document.createElement('a');
    a.href=item.url;a.target='_blank';a.rel='noreferrer';a.textContent='出典を開く';
    article.appendChild(a);
  }
  return article;
}
function syncUrl(){
  const u=new URL(location.href);
  u.searchParams.set('date',state.date);
  history.replaceState(null,'',u);
}
function render(){
  const data=state.data;if(!data)return;
  const daily=(data.days||[]).find(x=>x.date===state.date)||{date:state.date,checks:[]};
  fmtDay(state.date);
  $('updatedAt').textContent='データ更新 '+fmtDate(data.updatedAt);
  const checks=daily.checks||[];
  const alerts=checks.filter(x=>x.status==='update');
  const checked=checks.filter(x=>x.status!=='pending');
  const references=checks.flatMap(parent=>(parent.referenceItems||[]).map(item=>({item,parent})));
  $('alertCount').textContent=alerts.length;
  $('referenceCount').textContent=references.length;
  $('checkedCount').textContent=checked.length;
  $('priorityBadge').textContent=alerts.length+'件';
  $('referenceBadge').textContent=references.length+'件';
  const p=$('priorityList');p.replaceChildren(...alerts.map(makeCard));
  $('emptyPriority').hidden=alerts.length>0;
  const ref=$('referenceList');ref.replaceChildren(...references.map(({item,parent})=>makeReference(item,parent)));
  $('emptyReference').hidden=references.length>0;
  const all=$('allList');all.replaceChildren(...[...checks].sort((a,b)=>(a.priority||99)-(b.priority||99)).map(makeCard));
  syncUrl();
}
function shiftDay(delta){
  const d=new Date(state.date+'T00:00:00+09:00');d.setDate(d.getDate()+delta);
  state.date=d.toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});render();
}
async function load(){
  try{
    $('errorMessage').hidden=true;
    const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    state.data=await r.json();
    const requested=new URLSearchParams(location.search).get('date');
    state.date=requested||state.data.currentDate||state.data.days?.[0]?.date||new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
    render();
  }catch(e){$('errorMessage').textContent='データを読み込めません: '+e.message;$('errorMessage').hidden=false}
}
$('refreshButton').addEventListener('click',load);
$('prevDay').addEventListener('click',()=>shiftDay(-1));
$('nextDay').addEventListener('click',()=>shiftDay(1));
load();

</script>
</body>
</html>
